[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#EAF0F7"
textColor = "#172033"
font = "sans-serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
