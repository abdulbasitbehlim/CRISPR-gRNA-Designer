[theme]
base = "light"
primaryColor = "#059669"
backgroundColor = "#F5FAF8"
secondaryBackgroundColor = "#EDF7F3"
textColor = "#12201B"
font = "sans-serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 25

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

