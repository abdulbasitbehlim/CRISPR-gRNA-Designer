name: Feedback / Bug Report

description: Share a bug, scientific concern, usability issue, accession problem, feature request, or documentation feedback about CRISPR Studio.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CRISPR Studio.

        This repository and issue tracker are public. Do **not** include confidential, patient-identifiable, unpublished, proprietary, or otherwise sensitive biological sequence data. CRISPR Studio is a research/educational candidate-shortlisting tool and does not replace genome-wide specificity analysis or experimental validation.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Bug or error
        - Scientific or methodology concern
        - Usability / user-interface feedback
        - Feature request
        - Documentation issue
        - Performance issue
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the tool
      options:
        - Gene lookup (NCBI / Ensembl)
        - Accession ID lookup
        - DNA / RNA / FASTA sequence input
        - CRISPRi / TSS-aware design
        - SpCas9 guide discovery
        - Heuristic / Doench on-target scoring
        - MIT / CFD specificity
        - Local-reference off-target screen
        - GuideScan2 whole-genome mode
        - Validation / guide details
        - Charts / visualizations
        - CSV / FASTA / JSON export
        - Python API / local installation
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CRISPR Studio version
      placeholder: e.g. 3.2.0
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened, or what would you like improved?
      description: Describe the issue or suggestion clearly. Screenshots are welcome if they contain no sensitive information.
      placeholder: Describe the problem, concern, or suggestion...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: For bugs, include non-sensitive steps and example identifiers/sequences where possible.
      placeholder: |
        1. Open the app
        2. Choose input mode...
        3. Enter a non-sensitive example...
        4. Observe...
    validations:
      required: false

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected result vs. actual result
      placeholder: |
        Expected:
        Actual:
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Chrome on Windows 11; or Python 3.12
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Low — minor suggestion
        - Medium — affects usability or interpretation
        - High — blocks use or may affect scientific interpretation
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included confidential, patient-identifiable, proprietary, unpublished, or otherwise sensitive sequence/data in this public report.
          required: true
        - label: I understand that CRISPR Studio does not replace genome-wide specificity analysis or experimental validation.
          required: true
