name: Feedback / Bug Report

description: Share an error, scientific concern, usability issue, feature request, or other feedback about CRISPR Studio — gRNA Designer.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CRISPR Studio — gRNA Designer.

        This repository and its issue tracker are public. Please do **not** include confidential, patient-identifiable, unpublished, proprietary, or otherwise sensitive biological sequence data. The tool is intended for research and educational use and does not replace genome-wide specificity analysis or experimental validation.

  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      description: What best describes your feedback?
      options:
        - Bug or error
        - Scientific or methodology concern
        - Usability / user-interface feedback
        - Feature request
        - Documentation issue
        - Performance issue
        - Other
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the tool
      description: Which part of CRISPR Studio is involved?
      options:
        - Gene lookup (NCBI / Ensembl)
        - DNA / RNA / FASTA sequence input
        - SpCas9 (NGG) guide discovery
        - Activity scoring / ranking
        - Validation checks
        - Local-reference off-target screen
        - Charts / visualizations
        - CSV / Excel / FASTA / JSON export
        - Python API / local installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened, or what would you like improved?
      description: Please describe the issue or suggestion clearly. Screenshots are welcome if they contain no sensitive information.
      placeholder: Describe the problem, concern, or suggestion...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (for bugs/errors)
      description: If applicable, list the steps that reproduce the problem. Use non-sensitive example data where possible.
      placeholder: |
        1. Open...
        2. Select...
        3. Enter a non-sensitive example...
        4. Observe...
    validations:
      required: false

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected result vs. actual result
      description: If applicable, tell us what you expected and what the tool produced instead.
      placeholder: |
        Expected:
        Actual:
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      description: Browser/OS for the web app, or Python version if running locally.
      placeholder: e.g., Chrome 151 on Windows 11; or Python 3.12
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: How important is this issue to you?
      options:
        - Low — minor suggestion
        - Medium — affects usability or interpretation
        - High — blocks use or may affect scientific interpretation
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have not included confidential, patient-identifiable, proprietary, or otherwise sensitive sequence/data in this public report.
          required: true
        - label: I understand that CRISPR Studio is a research/educational candidate-shortlisting tool and does not replace genome-wide specificity analysis or experimental validation.
          required: true
